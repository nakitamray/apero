<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>apero</title>
    <meta name="description" content="Rate what you ate on campus, rank it, and find cheap eats nearby." />
    <link rel="icon" href="img/orange_slice.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <main class="table">
      <!-- the tour: each step sends the phone to that part of the app -->
      <aside class="card tour">
        <h1 class="wordmark">apero</h1>
        <p class="tagline">Rate what you ate. Find where to eat next.</p>
        <p class="label">Take it for a spin</p>
        <ol class="steps">
          <li><button data-step="school"><span class="n">1</span><span><b>Pick your school</b><small>start like a new student</small></span></button></li>
          <li><button data-step="today"><span class="n">2</span><span><b>See what's good</b><small>top dishes, deals, busy spots</small></span></button></li>
          <li><button data-step="explore"><span class="n">3</span><span><b>Find a spot</b><small>maps, prices, how to get there</small></span></button></li>
          <li><button data-step="rate"><span class="n">4</span><span><b>Rate a dish</b><small>verdict, then this or that</small></span></button></li>
          <li><button data-step="friends"><span class="n">5</span><span><b>Friends &amp; taste match</b><small>who eats like you</small></span></button></li>
          <li><button data-step="decider"><span class="n">6</span><span><b>Decide as a group</b><small>spin the orange</small></span></button></li>
          <li><button data-step="deals"><span class="n">7</span><span><b>Student deals</b><small>posted by students</small></span></button></li>
          <li><button data-step="wrapped"><span class="n">8</span><span><b>Campus Wrapped</b><small>your semester in food</small></span></button></li>
        </ol>
        <p class="member">Already eating with apero? <a href="app/">Log in →</a></p>
        <a class="open-demo" href="app/?demo=1">Open the demo</a>
      </aside>

      <section class="stage" aria-label="apero demo">
        <div class="sun" aria-hidden="true"></div>
        <img class="sticker s-goldfish" src="img/goldfish.png" alt="" />
        <img class="sticker s-shell" src="img/shell.png" alt="" />
        <img class="sticker s-stamp" src="img/stamp.png" alt="" />
        <img class="sticker s-matchbox" src="img/matchbox.png" alt="" />
        <img class="sticker s-lemon" src="img/lemon.png" alt="" />
        <img class="sticker s-burst" src="img/burst.png" alt="" />
        <div class="phone-box">
          <div class="phone">
            <div class="island"></div>
            <iframe id="app" title="apero, running as a demo" src="app/?demo=1"></iframe>
          </div>
        </div>
      </section>

      <aside class="card caption" aria-live="polite">
        <img class="caption-art" id="caption-art" src="img/stamp.png" alt="" />
        <p class="label">You're on</p>
        <h2 id="caption-title">Pick your school</h2>
        <p id="caption-body">Start the way a new student would.</p>
        <p class="try" id="caption-try"></p>
      </aside>
    </main>

    <footer>made by Nakita</footer>

    <script src="tour.js"></script>
  </body>
</html>
